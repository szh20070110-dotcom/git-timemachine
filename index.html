<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #111214;
    --bar: #ededed;
    --chat-bg: #f5f5f5;
    --line: #d9d9d9;
    --green: #95ec69;
    --white: #ffffff;
    --text: #191919;
    --sub: #8c8c8c;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(900px 600px at 15% 0%, #24303d 0%, transparent 60%),
      radial-gradient(700px 500px at 95% 100%, #2d2334 0%, transparent 62%),
      var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .phone {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(390px, 100vw);
    height: min(844px, calc(100vh - 76px));
    background: var(--chat-bg);
    border-radius: 34px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.55),
      0 0 0 10px #0b0c0e,
      0 0 0 11px rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 34px;
    padding: 0 22px;
    background: var(--bar);
    font-size: 13px;
    font-weight: 600;
    color: #0b0b0b;
    letter-spacing: 0.4px;
    flex-shrink: 0;
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 500;
  }

  .signal { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; }
  .signal i { width: 2.5px; background: #0b0b0b; border-radius: 1px; display: block; }
  .signal i:nth-child(1) { height: 4px; }
  .signal i:nth-child(2) { height: 6px; }
  .signal i:nth-child(3) { height: 8px; }
  .signal i:nth-child(4) { height: 10px; }

  .battery {
    position: relative;
    width: 22px;
    height: 11px;
    padding: 1px;
    border: 1px solid rgba(0, 0, 0, 0.45);
    border-radius: 3px;
  }
  .battery::after {
    content: "";
    position: absolute;
    top: 3px;
    right: -3px;
    width: 2px;
    height: 4px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 0 1px 1px 0;
  }
  .battery span {
    display: block;
    width: 78%;
    height: 100%;
    background: #0b0b0b;
    border-radius: 1px;
  }

  .nav {
    position: relative;
    display: flex;
    align-items: center;
    height: 46px;
    padding: 0 14px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .nav-back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 24px;
    line-height: 1;
    color: #1a1a1a;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav-back:hover { background: rgba(0, 0, 0, 0.06); }

  .nav-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
  }

  .nav-more {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 26px;
    margin-left: auto;
    border-radius: 6px;
    font-size: 20px;
    letter-spacing: 1px;
    color: #1a1a1a;
    cursor: pointer;
  }
  .nav-more:hover { background: rgba(0, 0, 0, 0.06); }

  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 14px 18px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .chat::-webkit-scrollbar { width: 0; }
  .chat > :first-child { margin-top: auto; }

  .msg {
    display: flex;
    align-items: flex-start;
    max-width: 100%;
  }
  .msg.me { justify-content: flex-end; }

  .bubble {
    max-width: 74%;
    padding: 9px 12px;
    font-size: 15.5px;
    line-height: 1.45;
    border-radius: 6px;
    word-break: break-word;
  }
  .msg.them .bubble { background: var(--white); }
  .msg.me .bubble { background: var(--green); }

  .composer {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    background: var(--bar);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #3b3b3b;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.15s;
  }
  .icon-btn:hover { background: rgba(0, 0, 0, 0.06); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { display: block; width: 22px; height: 22px; }

  .input-box {
    flex: 1;
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 10px;
    border-radius: 6px;
    background: var(--white);
    font-size: 15px;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    user-select: none;
  }

  .caret {
    display: inline-block;
    width: 1.5px;
    height: 17px;
    margin-left: 1px;
    background: #07c160;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.5px;
    white-space: nowrap;
    user-select: none;
  }

  @media (max-width: 480px) {
    body { background: var(--chat-bg); }
    .phone {
      width: 100vw;
      height: 100vh;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="status-right">
      <span class="signal"><i></i><i></i><i></i><i></i></span>
      <span>5G</span>
      <span class="battery"><span></span></span>
    </span>
  </div>

  <header class="nav">
    <span class="nav-back">&#8249;</span>
    <span class="nav-title">小满</span>
    <span class="nav-more">&#8943;</span>
  </header>

  <main class="chat" id="chat"></main>

  <footer class="composer">
    <button class="icon-btn" aria-label="语音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="10" rx="3"></rect>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"></path>
        <path d="M12 18v3"></path>
      </svg>
    </button>
    <div class="input-box">说点什么…<span class="caret"></span></div>
    <button class="icon-btn" aria-label="表情">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"></circle>
        <circle cx="9" cy="10" r="0.6" fill="currentColor"></circle>
        <circle cx="15" cy="10" r="0.6" fill="currentColor"></circle>
        <path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"></path>
      </svg>
    </button>
    <button class="icon-btn" aria-label="更多">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 8v8M8 12h8"></path>
      </svg>
    </button>
  </footer>
</div>

<div class="hint">v1 · 静态聊天界面</div>

<script>
  const conversation = [
    { type: "them", text: "在忙吗？刚路过那家新开的咖啡店。" },
    { type: "me", text: "刚开完会，看到消息了。" },
    { type: "them", text: "窗外那排银杏黄了，阳光特别好。" },
    { type: "me", text: "听起来不错，我有好久没走那条路了。" },
    { type: "them", text: "周末一起去坐坐？我这有个靠窗的位置。" }
  ];

  const chat = document.getElementById("chat");

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderMessage(item) {
    const row = el("div", "msg " + item.type);
    row.appendChild(el("div", "bubble", item.text));
    return row;
  }

  conversation.forEach((item) => chat.appendChild(renderMessage(item)));
</script>

</body>
</html>
